name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le code (décompresser le .zip)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do unzip -o -q "$z" -x '.github/*'; git rm -q "$z"; done
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Installation du code de l'application"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Générer les fichiers Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ml.aichaservices --project-name aicha_services .
            rm -f test/widget_test.dart
          fi

      - name: Réglages Android (Internet, minSdk, nom)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's/android:label="aicha_services"/android:label="Aicha Services"/' "$MANIFEST"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
            fi
          done

      - run: flutter pub get

      - name: Icône de l'appli (logo)
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK (2e essai automatique si le réseau coupe)
        run: |
          build() {
            flutter build apk --release \
              --build-number=${{ github.run_number }} \
              --dart-define=BUILD_NUMBER=${{ github.run_number }} \
              --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
              --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
              --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }} \
              --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
              --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          }
          build || (echo "Nouvel essai dans 30 s..." && sleep 30 && build)

      - uses: actions/upload-artifact@v4
        with:
          name: aicha-services-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier la mise à jour pour les clients
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk aicha-services.apk
          if [ -f NOUVEAUTES.txt ]; then cp NOUVEAUTES.txt notes.txt; else echo "Mise à jour de l'application Aïcha Services" > notes.txt; fi
          gh release create "v${{ github.run_number }}" aicha-services.apk \
            --title "Version ${{ github.run_number }}" \
            --notes-file notes.txt --latest
